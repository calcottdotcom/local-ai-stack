# HTTP — plain access on port 80.
# After running 'just setup local-domains', ssl.conf is generated alongside
# this file and handles HTTPS on port 443.
#
# proxy_pass uses variables ($upstream) so nginx resolves hostnames via
# Docker's DNS at request time rather than at startup. This lets nginx start
# cleanly even when not all upstream containers are running.

# ── Chat UI ────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name chat.localai;

    location / {
        set $upstream           http://openwebui:8080;
        proxy_pass              $upstream;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $connection_upgrade;
        proxy_read_timeout      300s;
    }
}

