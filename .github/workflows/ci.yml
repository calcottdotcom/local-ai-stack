name: CI

on:
  pull_request:
    branches: [main]

# Cancel redundant runs on the same PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Docker Compose syntax ─────────────────────────────────────────────────
  compose-syntax:
    name: Compose — syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env (no real secrets needed for syntax check)
        run: |
          cp .env.example .env
          # OD_API_TOKEN uses :? in the compose file so must be non-empty
          sed -i "s|^OD_API_TOKEN=.*|OD_API_TOKEN=ci-test-$(openssl rand -hex 8)|" .env

      - name: base + ollama (nvidia)
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ollama.yml \
            -f docker/docker-compose.gpu-nvidia-ollama.yml \
            config --quiet

      - name: base + ollama (amd)
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ollama.yml \
            -f docker/docker-compose.gpu-amd-ollama.yml \
            config --quiet

      - name: base + llamacpp (nvidia)
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.llamacpp.yml \
            -f docker/docker-compose.gpu-nvidia-llamacpp.yml \
            config --quiet

      - name: base + llamacpp (amd)
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.llamacpp.yml \
            -f docker/docker-compose.gpu-amd-llamacpp.yml \
            config --quiet

      - name: comfy (nvidia)
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.comfy.yml \
            -f docker/docker-compose.gpu-nvidia-comfy.yml \
            config --quiet

      - name: comfy (amd)
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.comfy.yml \
            -f docker/docker-compose.gpu-amd-comfy.yml \
            config --quiet

  # ── Dockerfile linting ────────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfiles — hadolint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - docker/hermes/Dockerfile
          - docker/pi/Dockerfile
          - docker/ubuntu-server/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # .hadolint.yaml in repo root is picked up automatically

  # ── Shell script linting ──────────────────────────────────────────────────
  shellcheck:
    name: Scripts — shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          # Scan both scripts/ and the ubuntu-server entrypoint
          scandir: ./scripts
          additional_files: docker/ubuntu-server/entrypoint.sh
          # .shellcheckrc in repo root is picked up automatically

  # ── Justfile syntax ───────────────────────────────────────────────────────
  justfile:
    name: Justfile — syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Check justfile parses and all recipes are listed
        run: just --list

  # ── Nginx config syntax ───────────────────────────────────────────────────
  nginx-config:
    name: Nginx — config syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test HTTP-only config syntax (before SSL setup)
        # ssl.conf is gitignored and not present yet — tests plain services.conf.
        # proxy_pass uses $upstream variables so nginx defers DNS to request
        # time — no --add-host stubs needed for the syntax check.
        run: |
          docker run --rm \
            -v "$PWD/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/config/nginx/conf.d:/etc/nginx/conf.d:ro" \
            nginx:alpine nginx -t

      - name: Generate dummy certs for SSL syntax check
        # ssl.conf references these paths; certs are gitignored so we generate
        # throw-away self-signed certs just to satisfy nginx -t.
        run: |
          mkdir -p config/nginx/certs
          openssl req -x509 -newkey rsa:2048 -days 1 -nodes \
            -keyout config/nginx/certs/localai-key.pem \
            -out    config/nginx/certs/localai.pem \
            -subj   "/CN=localai"

      - name: Generate SSL nginx config
        # --conf-only skips mkcert, /etc/hosts, and nginx reload — writes
        # ssl.conf and updates services.conf with HTTP→HTTPS redirects.
        run: bash scripts/setup-local-domains.sh --conf-only

      - name: Test SSL config syntax
        run: |
          docker run --rm \
            -v "$PWD/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/config/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/config/nginx/certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t

  # ── Ollama CPU smoke test ─────────────────────────────────────────────────
  inference-smoke:
    name: Inference — Ollama smoke (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cp .env.example .env
          sed -i "s|^OD_API_TOKEN=.*|OD_API_TOKEN=ci-test-$(openssl rand -hex 8)|" .env

      - name: Start Ollama (CPU — no GPU overlay)
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ollama.yml \
            up -d ollama

      - name: Wait for Ollama health endpoint
        run: |
          echo "Waiting for Ollama..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11435/api/tags > /dev/null 2>&1; then
              echo "Ollama ready (${i}s)"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not respond within 120s"
          docker logs ollama
          exit 1

      - name: Verify API response
        run: |
          curl -sf http://localhost:11435/api/tags | python3 -m json.tool
          curl -sf http://localhost:11435/api/version | python3 -m json.tool

      - name: Stop stack
        if: always()
        run: |
          docker compose --project-directory . \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ollama.yml \
            down

  # ── VRAM recommendation unit tests ───────────────────────────────────────
  vram-calculations:
    name: VRAM — recommendation unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test recommend_model and recommend_ctx
        run: |
          source scripts/gpu-detect.sh

          fail=0
          assert_eq() {
            local desc="$1" got="$2" want="$3"
            if [[ "$got" == "$want" ]]; then
              echo "  ✓ $desc"
            else
              echo "  ✗ $desc"
              echo "      got : $got"
              echo "      want: $want"
              fail=1
            fi
          }

          echo "recommend_model:"
          assert_eq "24GB → gemma4:12b 128K"  "$(recommend_model 24)" "gemma4:12b (128K context with room to spare)"
          assert_eq "15GB → gemma4:12b"        "$(recommend_model 15)" "gemma4:12b"
          assert_eq "12GB → gemma4:12b"        "$(recommend_model 12)" "gemma4:12b"
          assert_eq "9GB  → qwen3.5:9b"        "$(recommend_model  9)" "qwen3.5:9b"
          assert_eq "8GB  → qwen3.5:7b"        "$(recommend_model  8)" "qwen3.5:7b"
          assert_eq "6GB  → qwen3.5:7b"        "$(recommend_model  6)" "qwen3.5:7b"
          assert_eq "4GB  → qwen3.5:4b"        "$(recommend_model  4)" "qwen3.5:4b (limited context — consider a smaller model)"
          assert_eq "3GB  → CPU only"           "$(recommend_model  3)" "No GPU or too little VRAM — CPU inference only (very slow)"

          echo "recommend_ctx:"
          assert_eq "15GB + 7GB model  → 131072" "$(recommend_ctx 15 7)"  "131072"
          assert_eq "12GB + 5GB model  → 131072" "$(recommend_ctx 12 5)"  "131072"
          assert_eq "12GB + 7GB model  → 131072" "$(recommend_ctx 12 7)"  "131072"
          assert_eq "8GB  + 4GB model  → 65536"  "$(recommend_ctx  8 4)"  "65536"
          assert_eq "6GB  + 2GB model  → 65536"  "$(recommend_ctx  6 2)"  "65536"
          assert_eq "4GB  + 3GB model  → 16384"  "$(recommend_ctx  4 3)"  "16384"

          exit $fail

  # ── GPU smoke test (no GPU in CI — always allow failure) ──────────────────
  gpu-smoke:
    name: GPU check (expected to fail — no GPU in CI)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Create test .env
        run: |
          cp .env.example .env
          sed -i "s|^OD_API_TOKEN=.*|OD_API_TOKEN=ci-test-$(openssl rand -hex 8)|" .env
      - name: Run gpucheck (no GPU available — expected to fail)
        run: just gpucheck
