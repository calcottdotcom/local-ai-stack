name: local-ai-stack

networks:
  local-ai-net:
    driver: bridge

volumes:
  openwebui-data:
  hermes-home:
  opendesign-data:

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports:
      - "${OPENWEBUI_PORT:-8086}:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-}
      - DEFAULT_MODELS=${OLLAMA_MODEL:-}
      - WEBUI_AUTH=false
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
      - BYPASS_WEB_SEARCH_WEB_LOADER=true
      - BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=true
    volumes:
      - openwebui-data:/app/backend/data
    networks:
      - local-ai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    networks:
      - local-ai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  hermes:
    build: ./docker/hermes
    container_name: hermes
    ports:
      - "${HERMES_PORT:-8787}:8787"
    volumes:
      - hermes-home:/root
      - ./config/skills:/opt/shared-skills:ro
      - ./_projects:/root/projects
    environment:
      - INFERENCE_BASE_URL=${INFERENCE_BASE_URL:-http://ollama:11434/v1}
      - OPENAI_API_BASE_URL=${INFERENCE_BASE_URL:-http://ollama:11434/v1}
      - INFERENCE_PROVIDER=${INFERENCE_PROVIDER:-ollama}
      - INFERENCE_MODEL=${INFERENCE_MODEL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_CTX=${OLLAMA_CTX:-}
      - LLAMACPP_MODEL=${LLAMACPP_MODEL:-}
      - LLAMACPP_CTX=${LLAMACPP_CTX:-65536}
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/root/.hermes/webui
      - HERMES_WEBUI_AGENT_DIR=/usr/local/lib/hermes-agent
      - HERMES_WEBUI_AUTO_INSTALL=1
    networks:
      - local-ai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3g

  pi:
    build: ./docker/pi
    container_name: pi
    ports:
      - "${OPENDESIGN_PORT:-7456}:7456"
    volumes:
      - ./config/skills:/opt/shared-skills:ro
      - opendesign-data:/app/.od
      - ./_projects:/home/pi/projects
    environment:
      - INFERENCE_BASE_URL=${INFERENCE_BASE_URL:-http://ollama:11434/v1}
      - OPENAI_BASE_URL=${INFERENCE_BASE_URL:-http://ollama:11434/v1}
      - OPENAI_API_KEY=ollama
      - INFERENCE_PROVIDER=${INFERENCE_PROVIDER:-ollama}
      - INFERENCE_MODEL=${INFERENCE_MODEL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_CTX=${OLLAMA_CTX:-}
      - LLAMACPP_MODEL=${LLAMACPP_MODEL:-}
      - LLAMACPP_CTX=${LLAMACPP_CTX:-65536}
      - "OD_API_TOKEN=${OD_API_TOKEN:?OD_API_TOKEN must be set (generate with: openssl rand -hex 32)}"
    networks:
      - local-ai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  ubuntu-server:
    build: ./docker/ubuntu-server
    container_name: ubuntu-server
    ports:
      - "${SERVER_PORT:-8087}:80"
    networks:
      - local-ai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    networks:
      - local-ai-net
    restart: unless-stopped
    depends_on:
      - openwebui
      - searxng
      - hermes
    deploy:
      resources:
        limits:
          memory: 128m
